[project]
name = "nebula"
version = "0.1.0"
description = "Nebula: Rocket Learning's memory for Claude (MCP server, sync workers, search)"
readme = "README.md"
authors = [
    { name = "Rocket Learning" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "boto3>=1.43.114",
    "fastembed>=0.9.0",
    "fastmcp>=4.1.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.20.1",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
nebula = "nebula.cli:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
